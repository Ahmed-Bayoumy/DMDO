# The SBJ MDO problem: hierarchical ATC, formulation (a) of Tosserams et al. (2010), Fig. 6(a).
# Aircraft holds a copy of every coupling variable; propulsion, aerodynamics and structures only talk to aircraft
# (26 target-response pairs). Copies linked to two subproblems use a link list, e.g. [2, 3].

variables:
# vs:  [name,     sp_index, link, coupling, lb,      bl,        ub,        dim, var_type]
  v0: ["SFC", 1, 2, fb, 1.0, 2.0, 4.0, 1, "REAL"]
  v1: ["We", 1, 2, fb, 100.0, 15000.0, 30000.0, 1, "REAL"]
  v2: ["Wt", 1, 3, ff, 5000.0, 25000.0, 100000.0, 1, "REAL"]
  v3: ["LD", 1, 3, fb, 0.1, 5.0, 10.0, 1, "REAL"]
  v4: ["Ws", 1, 4, fb, 5000.0, 25000.0, 100000.0, 1, "REAL"]
  v5: ["Wf", 1, 4, fb, 5000.0, 25000.0, 100000.0, 1, "REAL"]
  # Aircraft copies of the propulsion / aerodynamics / structures couplings (formulation a)
  v61: ["D", 1, [2, 3], fb, 1000.0, 40000.0, 70000.0, 1, "REAL"]
  v62: ["ESF", 1, [2, 3], fb, 0.5, 1.0, 1.5, 1, "REAL"]
  v63: ["tc", 1, [3, 4], s, 0.01, 0.05, 0.1, 1, "REAL"]
