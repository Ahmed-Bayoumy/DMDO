subproblem:
  sp1:
    nv: 15
    index: 1
    vars: [v0, v1, v3, v4, v5, v61, v62, v63, v64, v65, v66, v67, v68, v69, v70]
    resps: [v2, v55]
    is_main: true
    MDA: 1
    coordinator: 1
    opt: SBJ_aircraft_opt
    type: callable
    fmin_nop: inf
    budget: 50
    display: true
    psize: 1.
    pupdate: DEFAULT
    freal: 34300
    solver: scipy
    scipy:
      method: SLSQP
      is_con: true
      normalize: true
      cache_constraints: true
      restore_feasibility: true
      scale_objective: true
      tol: 1.0e-8
      options: {maxiter: 100, ftol: 1.0e-9, eps: 1.0e-7, disp: false}
    save_results: true
    configurations: CSP1

  sp2:
    nv: 2
    index: 2
    vars: [v8, v10]
    resps: [v6, v7, v9, v56, v57]
    is_main: false
    MDA: 2
    coordinator: 1
    opt: SBJ_propulsion_opt
    type: callable
    fmin_nop: inf
    budget: 50
    display: false
    psize: 1.
    pupdate: DEFAULT
    solver: mads
    save_results: true
    configurations: CSP1

  sp3:
    nv: 12
    index: 3
    vars: [v13, v12, v15, v17, v18, v19, v20, v21, v22, v23, v24, v25]
    resps: [v16, v11, v14, v58, v59, v60]
    is_main: false
    MDA: 3
    coordinator: 1
    opt: SBJ_aerodynamics_opt
    type: callable
    fmin_nop: inf
    budget: 50
    display: true
    psize: 1.
    pupdate: DEFAULT
    solver: scipy
    scipy:
      method: SLSQP
      is_con: true
      normalize: true
      cache_constraints: true
      restore_feasibility: true
      scale_objective: true
      tol: 1.0e-8
      options: {maxiter: 50, ftol: 1.0e-9, eps: 1.0e-7, disp: false}
    save_results: true
    save_all_best: false
    configurations: CSP1

  sp4:
    nv: 26
    index: 4
    vars: [v27, v30, v31, v32, v33, v34, v35, v36, v37, v38, v39, v40, v41, v42, v43, v44, v45, v46, v47, v48, v49, v50, v51, v52, v53, v54]
    resps: [v28, v29, v26]
    is_main: false
    MDA: 4
    coordinator: 1
    opt: SBJ_structure_opt
    type: callable
    fmin_nop: inf
    budget: 50
    display: false
    psize: 2.
    pupdate: DEFAULT
    solver: scipy
    scipy:
      method: SLSQP
      is_con: true
      normalize: true
      cache_constraints: true
      restore_feasibility: true
      scale_objective: true
      tol: 1.0e-8
      options: {maxiter: 200, ftol: 1.0e-9, eps: 1.0e-7, disp: false}
    save_results: true
    save_all_best: false
    configurations: CSP1

USER:
  h: 55000
  M: 1.4

MDO:
  architecture: IDF
  coordinator: 1
  subproblems: [1, 2, 3, 4]
  responses: [v2, v6, v7, v9, v16, v11, v14, v28, v29, v26]
  fmin: inf
  hmin: inf
  display: true
  inc_stop: 1.0e-6
  stop: "Iteration budget exhausted"
  tab_inc: []
  noprogress_stop: 100

# March 2026 MADS settings (DMDO b87b4fb defaults) for DMDO 2612; search: MADS sampling (LH) instead of VNS.
CONFIG:
  CSP1:
    constraintsHandling:
      barriers: PB_all
      rho: 0.001
      h_max: 0.01
      lambda_multipliers: 1000
    options:
      seed: 10000
      tol: 0.001
      psize_init: 1
      display: false
      opportunistic: true
      check_cache: true
      store_cache: true
      collect_y: false
      rich_direction: false
      precision: high
      save_results: false
      save_coordinates: false
      save_all_best: false
      parallel_mode: false
    search:
      type: sampling
      s_method: LH
      ns: 10
      visualize: false
      criterion: null