DA:
  DA1:
    index: 1
#   inputs: ["SFC","We","LD","Ws","Wf"]
    inputs: [v0, v1, v3, v4, v5]
#   outputs: ["Wt","range"]
    outputs: [v2, v55]
    blackbox: SBJ_aircraft_analysis
    type: callable
    links: [2, 3, 4]
    coupling_type: ff

  DA2:
    index: 2
#   inputs: ["D","T"]
    inputs: [v8, v10]
#   outputs: ["SFC","We","ESF","Temp_E","Throttle_uA"]
    outputs: [v6, v7, v9, v56, v57]
    blackbox: SBJ_propulsion_analysis
    type: callable
    links: [1, 3]
    coupling_type: ff

  DA3:
    index: 3
    # inputs: ["Wt","ESF","theta","tc","ARw","LAMBDAw","Sref","Sht","ARht","LAMBDAht","Lw","Lht"]
    inputs: [v13, v12, v15, v17, v18, v19, v20, v21, v22, v23, v24, v25]
    # outputs: ["L","D","LD","Pg","CLo1","CLo2"]
    outputs: [v16, v11, v14, v58, v59, v60]
    blackbox: SBJ_aerodynamics_analysis
    type: callable
    links: [1, 2, 4]
    coupling_type: ff

  DA4:
    index: 4
    # inputs: ["L","tc","ARw","LAMBDAw","Sref","Sht","ARht","lambda","t","ts"]
    inputs: [v27, v30, v31, v32, v33, v34, v35, v36, v37, v38, v39, v40, v41, v42, v43, v44, v45, v46, v47, v48, v49, v50, v51, v52, v53, v54]
    # outputs: ["Ws","Wf","theta"]
    outputs: [v28, v29, v26]
    blackbox: SBJ_structure_analysis
    type: callable
    links: [1, 3]
    coupling_type: ff

MDA:
  MDA1:
    index: 1
    nAnalyses: 1
    analyses: [1]
    variables: [v0, v1, v3, v4, v5, v61, v62, v63, v64, v65, v66, v67, v68, v69, v70]
    responses: [v2, v55]

  MDA2:
    index: 2
    nAnalyses: 1
    analyses: [2]
    variables: [v8, v10]
    responses: [v6, v7, v9, v56, v57]

  MDA3:
    index: 3
    nAnalyses: 1
    analyses: [3]
    variables: [v13, v12, v15, v17, v18, v19, v20, v21, v22, v23, v24, v25]
    responses: [v16, v11, v14, v58, v59, v60]

  MDA4:
    index: 4
    nAnalyses: 1
    analyses: [4]
    variables: [v27, v30, v31, v32, v33, v34, v35, v36, v37, v38, v39, v40, v41, v42, v43, v44, v45, v46, v47, v48, v49, v50, v51, v52, v53, v54]
    responses: [v28, v29, v26]


coord:
  c1:
    index: 1
    type: ADMM
    # Paper settings (Tosserams et al., Sec. 4.3): slow penalty growth beta = 1.03, gamma = 0.75.
    beta: 1.03
    gamma: 0.75
    nsp: 4
    budget: 500
    index_of_master_SP: 1
    display: true
    # q = (copy - copy) / reference, the paper's scaling (variables scaled so the Table 1 reference is 1).
    scaling: reference
    w_init: 60
    mode: serial
    M_update_scheme: normal
    store_q_io: true
    # One multiplier/penalty update per outer iteration (method of multipliers, as in NoHiMDO and the paper).
    single_multiplier_update: true

