  v66: ["Sref", 1, [3, 4], s, 200.0, 500.0, 800.0, 1, "REAL"]
  v67: ["Sht", 1, [3, 4], s, 50.0, 100.0, 148.9, 1, "REAL"]
  v68: ["ARht", 1, [3, 4], s, 2.5, 5.5, 8.5, 1, "REAL"]
  v69: ["theta", 1, [3, 4], fb, 0.2, 10.0, 50.0, 1, "REAL"]
  v70: ["L", 1, [3, 4], fb, 5000.0, 25000.0, 100000.0, 1, "REAL"]
  v6: ["SFC", 2, 1, ff, 1.0, 2.0, 4.0, 1, "REAL"]
