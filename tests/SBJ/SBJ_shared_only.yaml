    blackbox: SBJ_aerodynamics_analysis
    type: callable
    links: [1,2,4]
    coupling_type: ff

  DA4:
    index: 4
    # inputs: ["L","tc","ARw","LAMBDAw","Sref","Sht","ARht","lambda","t","ts"]
