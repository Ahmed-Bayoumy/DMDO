USER:
  h: 55000
  M: 1.4

MDO:
  architecture: IDF
  coordinator: 1
  subproblems: [1, 2, 3, 4]
  responses: [v2, v6,v7,v9, v16,v11,v14, v28,v29, v26]
  fmin: inf
  hmin: inf
  display: True
  inc_stop: 0.0000000001
  stop: "Iteration budget exhausted"
  tab_inc: []
  noprogress_stop: 500


CONFIG:
  CSP:
    constraintsHandling:
      Barriers:
        [PB, PB, PB, PB, PB, PB]
    options:
        "seed": 10000
        "budget": 50
        "tol": 0.0000000000001
        "psize_init": 1
        "display": False
        "opportunistic": False
        "check_cache": True
        "store_cache": True
        "collect_y": False
        "rich_direction": True
        "precision": "low"
        "save_results": False
        "save_coordinates": False
        "save_all_best": False
        "parallel_mode": False

    search:
        "type": "sampling"
        "s_method": "LH"
        "ns": 10
        "visualize": False