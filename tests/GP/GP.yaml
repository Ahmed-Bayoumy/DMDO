# Geometric Programming (GP) MDO problem

variables:
# vs:  [name,     sp_index, link, coupling, lb,      bl,        ub,        dim, var_type]
  v0:  ["z1",     1,        null, ff,       1e-6,    500000,     1e6,       1,   "REAL"]
  v1:  ["z2",     1,        null, ff,       1e-6,    500000,     1e6,       1,   "REAL"]
  v2:  ["z3",     1,        2,    fb,       1e-6,    500000,     1e6,       1,   "REAL"]
  v3:  ["z4",     1,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v4:  ["z5",     1,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v5:  ["z6",     1,        3,    fb,       1e-6,    500000,     1e6,       1,   "REAL"]
  v6:  ["z7",     1,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v7:  ["z3",     2,        1,    ff,       1e-6,    500000,     1e6,       1,   "REAL"]
  v8:  ["z8",     2,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v9:  ["z9",     2,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v10: ["z10",    2,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v11: ["z11",    2,        3,    s,        1e-6,    500000,     1e6,       1,   "REAL"]
  v12: ["z6",     3,        1,    ff,       1e-6,    500000,     1e6,       1,   "REAL"]
  v13: ["z11",    3,        2,    s,        1e-6,    500000,     1e6,       1,   "REAL"]
  v14: ["z12",    3,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v15: ["z13",    3,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]
  v16: ["z14",    3,        null, u,        1e-6,    500000,     1e6,       1,   "REAL"]

DA:
  DA1:
    index: 1
    inputs: [v2, v3, v4, v5, v6]
    outputs: [v0, v1]
    blackbox: GP_A1
    type: callable
    links: [2, 3]
    coupling_type: fb

  DA2:
    index: 2
    inputs: [v8, v9, v10, v11]
    outputs: [v7]
    blackbox: GP_A2
    type: callable
    links: [1, 3]
    coupling_type: ff

  DA3:
    index: 3
    inputs: [v13, v14, v15, v16]
    outputs: [v12]
    blackbox: GP_A3
    type: callable
    links: [1, 2]
    coupling_type: ff

MDA:
  MDA1:
    index: 1
    nAnalyses: 1
    analyses: [1]
    variables: [v2, v3, v4, v5, v6]
    responses: [v0, v1]

  MDA2:
    index: 2
    nAnalyses: 1
    analyses: [2]
    variables: [v8, v9, v10, v11]
    responses: [v7]

  MDA3:
    index: 3
    nAnalyses: 1
    analyses: [3]
    variables: [v13, v14, v15, v16]
    responses: [v12]

coord:
  c1:
    index: 1
    type: ADMM
    beta: 1.4
    gamma: 0.4
    nsp: 3
    budget: 50
    index_of_master_SP: 1
    display: True
    scaling: null
    mode: serial
    M_update_scheme: median
    store_q_io: True
    is_AI_regularizer: True
    spike_influence_on_multipliers: False
    AI_spike_policy: "L1_Predictive"
    spike_w_damp_scale: 1.35 #1.45 1.15
    spike_w_amplify_scale: 1.01
    spike_gamma_scale: 0.01
    budget_scale: 5
    spike_adaptive_scales: true
    refit_every: 5
    detector_warm_start_from_history: false

subproblem:
  sp1:
    nv: 5
    index: 1
    vars: [v2, v3, v4, v5, v6]
    resps: [v0, v1]
    is_main: True
    MDA: 1
    coordinator: 1
    opt: GP_opt1
    type: callable
    fmin_nop: inf
    budget: 50
    display: False
    psize: 2.0
    pupdate: LAST
    solver: mads
    save_results: True
    realistic_objective: False
    configurations: CSP1

  sp2:
    nv: 4
    index: 2
    vars: [v8, v9, v10, v11]
    resps: [v7]
    is_main: False
    MDA: 2
    coordinator: 1
    opt: GP_opt2
    type: callable
    fmin_nop: inf
    budget: 50
    display: False
    psize: 1.0
    pupdate: LAST
    solver: mads
    save_results: False
    configurations: CSP2

  sp3:
    nv: 4
    index: 3
    vars: [v13, v14, v15, v16]
    resps: [v12]
    is_main: False
    MDA: 3
    coordinator: 1
    opt: GP_opt3
    type: callable
    fmin_nop: inf
    budget: 50
    display: False
    psize: 1.0
    pupdate: LAST
    solver: mads
    save_results: False
    configurations: CSP3

USER:

MDO:
  architecture: IDF
  coordinator: 1
  subproblems: [1, 2, 3]
  responses: [v5, v10]
  fmin: inf
  hmin: inf
  display: True
  inc_stop: 0.00000001
  stop: "Iteration budget exhausted"
  tab_inc: []
  noprogress_stop: 100

CONFIG:
  CSP1:
    options:
      seed: 12345
      budget: 250
      tol: 0.000000001
      psize_init: 2.0
      display: False
      opportunistic: False
      check_cache: True
      store_cache: True
      collect_y: False
      rich_direction: True
      precision: "high"
      save_results: True
      save_coordinates: False
      save_all_best: False
      parallel_mode: False
    search:
      type: "sampling"
      s_method: "ACTIVE"
      ns: 10
      visualize: False

  CSP2:
    options:
      seed: 12345
      budget: 250
      tol: 0.000000001
      psize_init: 1.0
      display: False
      opportunistic: False
      check_cache: True
      store_cache: True
      collect_y: False
      rich_direction: True
      precision: "high"
      save_results: False
      save_coordinates: False
      save_all_best: False
      parallel_mode: False
    search:
      type: "sampling"
      s_method: "ACTIVE"
      ns: 10
      visualize: False

  CSP3:

    options:
      seed: 12345
      budget: 250
      tol: 0.000000001
      psize_init: 1.0
      display: False
      opportunistic: False
      check_cache: True
      store_cache: True
      collect_y: False
      rich_direction: True
      precision: "high"
      save_results: False
      save_coordinates: False
      save_all_best: False
