[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "DMDO"
version = "2612.0"
requires-python = ">=3.10"
description = "Distributed Multidisciplinary Design Optimization (DMDO)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Ahmed H. Bayoumy", email = "ahmed.bayoumy@mail.mcgill.ca" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.2.6",
    "samplerslib>=2610.0",
    "omads>=2610.0",
    "pandas>=2.2.3, <3.0.0",
    "pyyaml>=6.0.3",
    "paramiko>=3.0.0",
    "scipy>=1.15.3",
    "dash>=4.1.0",
    "torch>=2.12.1",
]

[project.scripts]
dmdo = "DMDO.service.cli:main"

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.8",
    "plotly>=6.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# E9, F63, F7, F82 are standard in Ruff's default 'E' and 'F' selections
select = ["E", "F", "C90"] 

[tool.ruff.lint.mccabe]
max-complexity = 15

