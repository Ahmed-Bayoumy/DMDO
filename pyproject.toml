[project]
name = "DMDO"
version = "2601.1"
requires-python = ">=3.10"
description = "Distributed Multidisciplinary Design Optimization (DMDO)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Ahmed H. Bayoumy", email = "ahmed.bayoumy@mail.mcgill.ca" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.2.6",
    "samplerslib==2408",
    "omads==2408.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.8",
    "plotly>=6.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# E9, F63, F7, F82 are standard in Ruff's default 'E' and 'F' selections
select = ["E", "F", "C90"] 

[tool.ruff.lint.mccabe]
max-complexity = 15

